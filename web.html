<!DOCTYPE html>
<html>
    <head>
        <title>Workout tracker</title>
        <link rel="stylesheet" href="style_sheet.css">
    </head>
    <body>
       <h1 class="heading">Workout plan:</h1>
       <form>
        <table class="workout">
            <thead>
                <th>Exercise</th>
                <th>Repetition</th>
            </thead>
            <tbody>
                <tr>
                    <td class="exo">Bulgarian Split Squats</td>
                    <td class="rep">
                        <input name="Repetition" type="number" value="8">
                    </td>
                </tr>
                <tr>
                    <td class="exo">Weighted Glute Bridges</td>
                    <td class="rep">
                        <input name="Repetition" type="number" value="8">
                    </td>
                </tr>
                <tr>
                    <td class="exo">Squats</td>
                    <td class="rep">
                        <input name="Repetition" type="number" value="12">
                    </td>
                </tr>   
                <tr>
                    <td class="exo">Knee push ups</td>
                    <td class="rep">
                        <input name="Repetition" type="number" value="8">
                    </td>
                </tr>
                <tr>
                    <td class="exo">Weighted rows</td>
                    <td class="rep">
                        <input name="Repetition" type="number" value="10">
                    </td>
                </tr>
                <tr>
                    <td class="exo">Plank</td>
                    <td class="rep">
                        <input name="Repetition" type="number" value="30">
                    </td>
                </tr>
            </tbody>
        </table>
        <button>Copy log for ai trainer (attempt 1)</button>
       </form>
        
    </body>
</html>
